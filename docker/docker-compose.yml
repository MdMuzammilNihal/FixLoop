# Run from the repository root:  docker compose -f docker/docker-compose.yml up --build
# Then pull the models once:     docker compose -f docker/docker-compose.yml exec ollama ollama pull llama3
#                                docker compose -f docker/docker-compose.yml exec ollama ollama pull codellama
services:
  fixloop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"   # code execution is not sandboxed: keep this on localhost
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - OLLAMA_CODE_MODEL=codellama
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
